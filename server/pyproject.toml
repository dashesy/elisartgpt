[project]
name = "elisart"
version = "0.1.0"
description = "Server that turns prompts into pictures through Codex CLI on a ChatGPT plan"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "pydantic-settings>=2.8",
    # Photo uploads arrive as multipart/form-data.
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff==0.16.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elisart"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
